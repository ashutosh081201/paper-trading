# Render Blueprint for the StockLab API (free web service).
# Secrets are marked `sync: false`: Render asks for them when the Blueprint
# is created, and they are never stored in this file.
services:
  - type: web
    name: stocklab-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # mongodb-memory-server (tests only) would otherwise download MongoDB
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: TOKEN_KEY
        generateValue: true
      - key: MONGO_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
